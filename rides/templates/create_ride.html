{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 650px; margin: 40px auto; color: #111;">
  <h2 style="margin-bottom: 6px;">Offer a Ride</h2>
  <p style="margin-bottom: 14px; font-style: italic;">Find passengers for your next trip!</p>

  <form action="{% url 'rides:create' %}" method="post">
    {% csrf_token %}
    {{ new_ride_form.as_p }}
    <button type="submit" class="btn btn-primary">Submit Ride</button>
  </form>

  <div style="margin-top: 16px;">
    <a href="{% url 'rides:index' %}">&larr; Back to search</a>
  </div>
</div>
{% endblock %}
