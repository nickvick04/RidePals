{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RidePals - Carpooling Made Easy</title>

  <link rel="stylesheet" href="{% static 'main.css' %}">
  <script src="{% static 'main.js' %}"></script>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="nav-brand">
        <img src="{% static 'logo.jpg' %}" alt="RidePals logo" class="nav-brand-logo">
        <span>RidePals</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/rides/">Search Riders</a></li>
        <li><a href="/rides/offer/">Offer a Ride</a></li>
        <li><a href="/how-it-works/">How It Works</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="content">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
